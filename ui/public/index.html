<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeHack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 32px; color: #58a6ff; }
    .card {
      width: 100%;
      max-width: 720px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label { font-size: 0.8rem; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; }
    select, textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color .15s;
    }
    select:focus, textarea:focus { border-color: #58a6ff; }
    textarea { resize: vertical; min-height: 130px; font-family: inherit; }
    button {
      align-self: flex-end;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .output-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 14px;
      min-height: 120px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e6edf3;
    }
    .output-box.error { color: #f85149; border-color: #f85149; }
    .status { font-size: 0.8rem; color: #8b949e; }
  </style>
</head>
<body>
  <h1>CodeHack</h1>
  <div class="card">
    <div>
      <label for="model">Model</label>
      <select id="model">
        <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
        <option value="claude-opus-4-8">claude-opus-4-8</option>
        <option value="claude-haiku-4-5-20251001">claude-haiku-4-5-20251001</option>
      </select>
    </div>
    <div>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="Enter your prompt…"></textarea>
    </div>
    <button id="run-btn">Run</button>
    <div>
      <label>Output</label>
      <div class="output-box" id="output">—</div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const modelSel = document.getElementById('model');
    const promptEl = document.getElementById('prompt');
    const runBtn   = document.getElementById('run-btn');
    const output   = document.getElementById('output');
    const status   = document.getElementById('status');

    modelSel.addEventListener('change', async () => {
      await fetch('/api/set-model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: modelSel.value }),
      });
    });

    runBtn.addEventListener('click', async () => {
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      runBtn.disabled = true;
      status.textContent = 'Running…';
      output.textContent = '';
      output.className = 'output-box';
      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.error) {
          output.textContent = data.error;
          output.className = 'output-box error';
          status.textContent = 'Error';
        } else {
          output.textContent = data.result;
          status.textContent = 'Done';
        }
      } catch (e) {
        output.textContent = e.message;
        output.className = 'output-box error';
        status.textContent = 'Network error';
      } finally {
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
